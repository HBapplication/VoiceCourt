<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VoiceCourt - מעקב משחק</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070B12">
<meta name="background-color" content="#070B12">

<!-- Android / Chrome install -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32-v2.png">

<!-- iOS "Add to Home Screen" support (Safari ignores manifest.json for most of this) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VoiceCourt">
<link rel="apple-touch-icon" href="icon-180-v2.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152-v2.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v2.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"><div style="padding:40px;text-align:center;color:#8A9AB2;">טוען...</div></div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW registration failed', err));
    });
  }
</script>
</body>
</html>
